name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install libcurl
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Build
        run: gcc -O2 -Wall -Wextra -o laping-linux-x86_64 src/*.c -lcurl -lm -lpthread
      - name: Test
        run: tests/run_tests.sh ./laping-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: laping-linux-x86_64
          path: laping-linux-x86_64

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 zip
      - name: Download prebuilt libcurl (mingw, win64)
        run: |
          curl -sL "https://curl.se/windows/latest.cgi?p=win64-mingw.zip" -o curl-mingw.zip
          unzip -q curl-mingw.zip
          mv curl-*-win64-mingw curl-mingw
      - name: Build
        run: |
          x86_64-w64-mingw32-gcc -O2 -Wall -Wextra -D__USE_MINGW_ANSI_STDIO=1 \
            -I curl-mingw/include \
            -o laping.exe src/*.c \
            -L curl-mingw/lib -lcurl.dll -lws2_32 -lwldap32 -lcrypt32 \
            -Wl,--stack,268435456
          cp curl-mingw/bin/libcurl-x64.dll .
          zip laping-windows-x86_64.zip laping.exe libcurl-x64.dll
      - uses: actions/upload-artifact@v4
        with:
          name: laping-windows-x86_64
          path: laping-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: laping-windows-binaries
          path: |
            laping.exe
            libcurl-x64.dll

  build-installer:
    needs: build-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: laping-windows-binaries
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y
      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v',''
          $env:LAPING_VERSION = $version
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: laping-windows-setup
          path: laping-windows-x86_64-setup.exe

  release:
    needs: [build-linux, build-windows, build-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/laping-linux-x86_64
            dist/laping-windows-x86_64.zip
            dist/laping-windows-x86_64-setup.exe
          generate_release_notes: true

  # npm（@lapius/laping-lang）に公開する。Trusted Publisher（OIDC）で認証するのでトークンは不要
  npm:
    needs: build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # OIDC での公開には npm 11.5.1 以降が必要
      - run: pip install ziglang==0.16.0
      - run: node npm/build.mjs "${GITHUB_REF_NAME#v}" --publish
        env:
          ZIG: python3 -m ziglang
